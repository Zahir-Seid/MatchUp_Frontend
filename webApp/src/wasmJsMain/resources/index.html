<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F6F9F2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#070B09" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Find pickup football games, reserve your spot, and check in with MatchUp.">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MatchUp">
    <title>MatchUp</title>
    <style>html,body{margin:0;background:#f6f9f2;color-scheme:light dark}@media (prefers-color-scheme:dark){html,body{background:#070b09}}</style>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="webApp" aria-label="MatchUp application"></div>

<div id="boot" aria-live="polite">
    <div class="boot-mark">M</div>
    <div class="boot-name">MATCH<span>UP</span></div>
    <div class="boot-tagline">Find your game. Book your spot.</div>
    <div class="boot-spinner" aria-hidden="true"></div>
</div>

<script src="/webApp.js"></script>
<script>
    (function () {
        var boot = document.getElementById('boot');

        function hideBoot() {
            if (!boot) return;
            boot.classList.add('boot-hidden');
            window.setTimeout(function () {
                if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
            }, 260);
        }

        // Compose renders into a shadow root inside #webApp. Hide the static
        // splash as soon as its canvas exists. If it takes unusually long,
        // keep the splash visible with a hint instead of showing a blank page.
        var checks = 0;
        var timer = window.setInterval(function () {
            checks += 1;
            var host = document.getElementById('webApp');
            var root = host && host.shadowRoot;
            if (root && root.querySelector('canvas')) {
                window.clearInterval(timer);
                hideBoot();
                return;
            }
            if (boot && checks > 120 && !boot.dataset.slow) {
                boot.dataset.slow = '1';
                var tagline = boot.querySelector('.boot-tagline');
                if (tagline) {
                    tagline.textContent =
                        'Still loading. A slow connection can take a moment; older browsers without WebAssembly are not supported.';
                }
            }
        }, 100);

        if ('serviceWorker' in navigator) {
            function cacheLoadedAssets() {
                var controller = navigator.serviceWorker.controller;
                if (!controller || !window.performance ||
                    typeof performance.getEntriesByType !== 'function') {
                    return;
                }
                var origin = window.location.origin + '/';
                var urls = performance.getEntriesByType('resource')
                    .map(function (entry) { return entry.name; })
                    .filter(function (url) {
                        return url.indexOf(origin) === 0 &&
                            /\.(?:js|mjs|wasm|css|png|jpg|jpeg|svg|webp|ico|woff2?|ttf)$/i
                                .test(url.split('?')[0]);
                    });
                // The shell is cached on install; the bundle and its hashed WASM
                // files are cached here on first launch so the next launch can be
                // fully offline.
                urls.push('/webApp.js', '/styles.css');
                controller.postMessage({ type: 'CACHE_URLS', urls: urls });
            }

            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').then(function () {
                    return navigator.serviceWorker.ready;
                }).then(cacheLoadedAssets).catch(function (error) {
                    console.warn('MatchUp service worker registration failed', error);
                });
            });
            navigator.serviceWorker.addEventListener('controllerchange', cacheLoadedAssets);
        }
    })();
</script>
</body>
</html>
